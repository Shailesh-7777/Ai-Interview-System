# Server Configuration
server.port=8080

# Database Configuration (MySQL / MariaDB on port 3307)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_interview_prep}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
jwt.secret=${JWT_SECRET:AIInterviewPrepSecretKeyForJwtTokenGenerationMustBe256BitsOrMoreLong2026}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# AI Feedback Engine Configuration
# Supported providers: mock, gemini, openai
ai.provider=${AI_PROVIDER:mock}
ai.api-key=${AI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.aiinterview=INFO
logging.level.org.springframework.security=WARN
