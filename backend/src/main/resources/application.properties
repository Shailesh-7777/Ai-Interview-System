# Server Configuration (Binds to Render dynamic PORT or SERVER_PORT, default 8080)
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (MySQL / MariaDB)
# Supports:
# 1. Full connection strings via SPRING_DATASOURCE_URL, DATABASE_URL, MYSQL_URL, DB_URL
# 2. Discrete variables via DB_HOST / MYSQL_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${MYSQL_URL:${DB_URL:jdbc:mysql://${DB_HOST:${MYSQL_HOST:${MYSQLHOST:localhost}}}:${DB_PORT:${MYSQL_PORT:${MYSQLPORT:3306}}}/${DB_NAME:${MYSQL_DATABASE:${MYSQLDATABASE:ai_interview_prep}}}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:${MYSQL_USER:${MYSQLUSER:root}}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQL_PASSWORD:${MYSQLPASSWORD:root}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings for Cloud Resilience
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
jwt.secret=${JWT_SECRET:AIInterviewPrepSecretKeyForJwtTokenGenerationMustBe256BitsOrMoreLong2026}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# AI Feedback Engine Configuration
# Supported providers: mock, gemini, openai
ai.provider=${AI_PROVIDER:mock}
ai.api-key=${AI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.aiinterview=INFO
logging.level.org.springframework.security=WARN
